# Node.js with Vue
# Build a Node.js project that uses Vue.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- development

pool:
  name: build-agents-linux
steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  displayName: 'npm install and build'


- script: |
    ls $(Build.ArtifactStagingDirectory)/../s -a
    ls $(Build.ArtifactStagingDirectory) -a
  displayName: 'log'

- script: |
    cp -a $(Build.ArtifactStagingDirectory)/../s/dist $(Build.ArtifactStagingDirectory)
  displayName: 'copy build to output'

- task: PublishBuildArtifacts@1
  inputs:
    TargetPath:  '$(Build.ArtifactStagingDirectory)/../s'
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'mafry-frontend'
    

